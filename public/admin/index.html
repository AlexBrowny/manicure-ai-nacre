<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ-панель — Nacré</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233B2F5C'/%3E%3Cpath d='M16 6l2.4 7.6L26 16l-7.6 2.4L16 26l-2.4-7.6L6 16l7.6-2.4z' fill='%23F4B8A2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin">
  <div id="login" class="login" hidden>
    <form class="login__card" id="loginForm" novalidate>
      <p class="login__logo" data-studio-name>Nacré</p>
      <p class="login__sub">Админ-панель</p>
      <label class="login__label" for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="login__err" id="loginErr" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit">Войти</button>
      <a class="login__back" href="/">← На сайт</a>
    </form>
  </div>

  <div id="shell" class="shell" hidden>
    <aside class="side">
      <a class="side__logo" href="/" title="Открыть сайт"><span data-studio-name>Nacré</span><small>admin</small></a>
      <nav class="side__nav" id="nav" aria-label="Разделы">
        <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Обзор</span></a>
        <a href="#/schedule" data-route="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Расписание</span></a>
        <a href="#/bookings" data-route="bookings"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Записи</span></a>
        <a href="#/masters" data-route="masters"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4.5a4 4 0 0 1 0 7M22 21a7 7 0 0 0-4-6.3"/></svg><span>Мастера</span></a>
        <a href="#/services" data-route="services"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg><span>Услуги</span></a>
      </nav>
      <button class="side__logout" id="logout" type="button">Выйти</button>
    </aside>
    <main class="main">
      <header class="main__head">
        <h1 id="viewTitle" class="main__title"></h1>
        <div id="viewActions" class="main__actions"></div>
      </header>
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/admin/js/app.js"></script>
</body>
</html>
